<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Streaming Testbench{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e6e8ec; --muted:#9aa3b2;
          --accent:#4f9dff; --ok:#3ecf8e; --warn:#f5b84a; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:24px; padding:12px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; }
  header nav a { color:var(--muted); text-decoration:none; margin-right:16px; }
  header nav a.active, header nav a:hover { color:var(--text); }
  main { padding:24px; max-width:1400px; margin:0 auto; }
  h2 { font-size:15px; margin:24px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11.5px; background:#2a3140; color:var(--text); margin-right:4px; }
  .badge.hdr { background:#4a3a12; color:#ffd479; }
  .badge.ok { background:#123a2a; color:var(--ok); }
  .badge.warn { background:#3d3112; color:var(--warn); }
  .badge.err { background:#3d1717; color:var(--err); }
  .muted { color:var(--muted); }
  .warn { color:var(--warn); }
  .err { color:var(--err); }
  .url { display:flex; gap:8px; align-items:center; }
  .url input { flex:1; background:#0b0d11; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px 8px; font-family:ui-monospace,monospace; font-size:13px; min-width:280px; }
  button, .btn { background:#253045; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 12px; cursor:pointer; font-size:13px; text-decoration:none; }
  button:hover, .btn:hover { background:#2f3c57; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .stat { background:#11141a; border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .stat .v { font-size:20px; font-variant-numeric:tabular-nums; }
  .stat .k { color:var(--muted); font-size:12px; }
  dl.kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; margin:0; }
  dl.kv dt { color:var(--muted); }
  dl.kv dd { margin:0; }
  form.inline { display:inline; }
</style>
</head>
<body>
<header>
  <h1>Streaming Testbench</h1>
  <nav>
    <a href="/" class="{% if active == 'streams' %}active{% endif %}">Streams</a>
    <a href="/admin" class="{% if active == 'admin' %}active{% endif %}">Admin</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
function copyText(id) {
  const el = document.getElementById(id);
  el.select();
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(el.value); }
  else { document.execCommand("copy"); }
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
