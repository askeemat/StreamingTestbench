services:
  streaming-testbench:
    build: .
    image: streaming-testbench:latest
    container_name: streaming-testbench
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Put video files into ./media (or change the host path).
      - ./media:/media:ro
    environment:
      SEGMENT_DURATION: "4"
      MAX_CONCURRENT_JOBS: "4"
      PREINDEX: "true"
      ENABLE_AUDIO: "true"
      # ADMIN_PASSWORD: "change-me"        # enable basic auth for /admin
      # PUBLIC_BASE_URL: "http://192.168.1.10:8080"
